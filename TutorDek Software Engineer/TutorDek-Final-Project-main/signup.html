<!DOCTYPE html>
<html lang="id" class="auth-page">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign up</title>
    <link rel="stylesheet" href="Sign-up fiture/style.css">



  <link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="CSS/repairs.css">
</head>
  <body>
    <form action="landing-page.html" >
      <img class="img1" src="public/school.svg" alt="TutorDek">
      <div style="display: flex; flex-direction: row; justify-content: center; gap: 10px; align-items: center;">
        <h2 style="color: #0E5399; font-size: 40px;">TutorDek:</h2> <h2 style="color: white; font-size: 40px;"> Sign Up</h2>
      </div>
      <div class="form-group fullname">
        <label for="fullname">
          <input type="text" id="fullname" required autocomplete="name" placeholder="Username" onfocus="clearPlaceholder(this)" onblur="restorePlaceholder(this)">
        </label>
      </div>
      <div class="form-group email">
        <label class="visually-hidden" for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="Email Address" onfocus="clearPlaceholder(this)" onblur="restorePlaceholder(this)">
      </div>
      <div class="form-group password">
        <label class="visually-hidden" for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="10" placeholder="Password" onfocus="clearPlaceholder(this)" onblur="restorePlaceholder(this)">
      </div>
      <div class="form-group submit-btn">
        <input type="submit" value="Create account">
      </div>
      <div class="google">
        <img alt="" src="Sign-up fiture/public/search 1.svg" style="height: 30px; width: 30px;"><p>Sign Up with Google</p>
      </div>
      <div class="sign-in-class">
        <p style="color: white;">Already have an account?</p>
        <p class="sign-in" onclick=" location.href='sign-in.html'">Sign in</p>
      </div>
    </form>

    <script src="Sign-up fiture/script.js"></script>
    <script>
      function clearPlaceholder(input) {
        input.setAttribute('data-placeholder', input.placeholder);
        input.placeholder = '';
      }

      function restorePlaceholder(input) {
        input.placeholder = input.getAttribute('data-placeholder');
      }
    </script>

<script src="Javascript/client.js"></script>
<script src="Javascript/repairs.js"></script>
</body>
</html>
